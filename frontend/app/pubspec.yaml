name: olli
description: "Olli: Lernbegleiter für Grundschulkinder. Nur Anzeige und Antwort."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  http: ^1.6.0
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: false
  fonts:
    - family: Jost
      fonts:
        - asset: fonts/Jost-400-Book.ttf
          weight: 400
        - asset: fonts/Jost-500-Medium.ttf
          weight: 500
        - asset: fonts/Jost-600-Semi.ttf
          weight: 600
        - asset: fonts/Jost-700-Bold.ttf
          weight: 700
        - asset: fonts/Jost-800-Heavy.ttf
          weight: 800
