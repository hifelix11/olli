id: find_math_question
competency: find_math_question
kind: item_choice
params:
  a: { min: 5, max: 9 }
  b: { min: 1, max: 4 }
settings:
  items:
    - prompt: "Im Hof spielen {a} Kinder. {b} Kinder kommen dazu. Welche Frage kannst du ausrechnen?"
      answer: how_many_now
      options:
        how_many_now: "Wie viele Kinder sind es jetzt?"
        how_old: "Wie alt sind die Kinder?"
        names: "Wie heißen die Kinder?"
    - prompt: "Lena hat {a} Bonbons. Sie isst {b} davon. Welche Frage kannst du ausrechnen?"
      answer: how_many_left
      options:
        taste: "Wie schmecken die Bonbons?"
        how_many_left: "Wie viele Bonbons hat Lena noch?"
        where_from: "Woher hat Lena die Bonbons?"
    - prompt: "Im Bus sitzen {a} Kinder. An der Haltestelle steigen {b} Kinder aus. Welche Frage kannst du ausrechnen?"
      answer: how_many_left
      options:
        where_to: "Wohin fährt der Bus?"
        driver_age: "Wie alt ist der Busfahrer?"
        how_many_left: "Wie viele Kinder sind noch im Bus?"
    - prompt: "Tom hat {a} rote und {b} blaue Autos. Welche Frage kannst du ausrechnen?"
      answer: how_many
      options:
        how_many: "Wie viele Autos hat Tom?"
        fastest: "Welches Auto ist am schnellsten?"
        where: "Wo spielt Tom?"
    - prompt: "Auf dem Teller liegen {a} Kekse. Mia nimmt {b} Kekse. Welche Frage kannst du ausrechnen?"
      answer: how_many_left
      options:
        who_baked: "Wer hat die Kekse gebacken?"
        how_many_left: "Wie viele Kekse bleiben auf dem Teller?"
        plate_size: "Wie groß ist der Teller?"
    - prompt: "Im Garten blühen {a} gelbe und {b} rote Tulpen. Welche Frage kannst du ausrechnen?"
      answer: how_many
      options:
        smell: "Wie riechen die Tulpen?"
        how_many: "Wie viele Tulpen blühen im Garten?"
        who_planted: "Wer hat die Tulpen gepflanzt?"
    - prompt: "Ben hat {a} Sticker. Er bekommt {b} Sticker geschenkt. Welche Frage kannst du ausrechnen?"
      answer: how_many_now
      options:
        how_many_now: "Wie viele Sticker hat Ben jetzt?"
        who_gives: "Wer schenkt Ben die Sticker?"
        colour: "Welche Farbe haben die Sticker?"
    - prompt: "Auf dem Parkplatz stehen {a} Autos. {b} Autos fahren weg. Welche Frage kannst du ausrechnen?"
      answer: how_many_left
      options:
        speed: "Wie schnell fahren die Autos?"
        how_many_left: "Wie viele Autos stehen noch da?"
        owner: "Wem gehören die Autos?"
answer: choice
representations: [plain]
