id: order_quantities
competency: order_quantities
kind: compare_quantities
params:
  a: { min: 1, max: 20 }
  b: { min: 1, max: 20 }
settings:
  ask: [more, less]
variants:
  - prompts:
      more: Was ist mehr Geld?
      less: Was ist weniger Geld?
    labels:
      quantity: "{n} €"
  - prompts:
      more: Was ist länger?
      less: Was ist kürzer?
    labels:
      quantity: "{n} cm"
  - params:
      a: { min: 2, max: 12 }
      b: { min: 2, max: 12 }
    prompts:
      more: Was dauert länger?
      less: Was dauert kürzer?
    labels:
      quantity: { one: "{n} Stunde", other: "{n} Stunden" }
levels:
  easy:
    settings:
      ask: [more]
answer: choice
representations: [plain]
