id: compose_decompose_shapes
competency: compose_decompose_shapes
kind: item_choice
settings:
  items:
    - prompt: "Du faltest ein Quadrat einmal von Ecke zu Ecke. Welche Formen entstehen?"
      answer: two_triangles
      options: [two_triangles, two_squares, two_circles]
    - prompt: "Du faltest ein Quadrat einmal in der Mitte, Seite auf Seite. Welche Formen entstehen?"
      answer: two_rectangles
      options: [two_rectangles, two_triangles, two_circles]
    - prompt: "Du schneidest ein Rechteck einmal von Ecke zu Ecke durch. Welche Formen entstehen?"
      answer: two_triangles
      options: [two_squares, two_triangles, two_circles]
    - prompt: "Du schneidest einen Kreis einmal durch die Mitte. Welche Formen entstehen?"
      answer: two_semicircles
      options: [two_semicircles, two_triangles, two_squares]
    - prompt: "Du legst zwei gleiche Quadrate nebeneinander. Welche Form entsteht?"
      answer: rectangle
      options: [rectangle, triangle, circle]
    - prompt: "Du legst zwei gleiche Dreiecke mit der längsten Seite aneinander. Welche Form kann entstehen?"
      answer: square
      options: [square, circle, pentagon]
    - prompt: "Du legst vier gleiche kleine Quadrate zu einem großen Quadrat. Wie viele kleine Quadrate liegen in einer Reihe?"
      answer: "2"
      options: ["2", "3", "4"]
    - prompt: "Du faltest ein Blatt zweimal in der Mitte. Wie viele Teile siehst du beim Aufklappen?"
      answer: "4"
      options: ["2", "3", "4"]
labels:
  two_triangles: zwei Dreiecke
  two_squares: zwei Quadrate
  two_circles: zwei Kreise
  two_rectangles: zwei Rechtecke
  two_semicircles: zwei Halbkreise
  rectangle: ein Rechteck
  triangle: ein Dreieck
  circle: ein Kreis
  square: ein Quadrat
  pentagon: ein Fünfeck
answer: choice
representations: [plain]
